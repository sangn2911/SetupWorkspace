cursor_shape underline

# zsh-vi-mode sets beam/underline; do not let Kitty reset the cursor on prompt.
shell_integration enabled no-cursor

# 150% of Kitty's default 11pt.
font_size 15

# Hide the OS title bar and window borders.
hide_window_decorations yes

# Match Cursor Monokai Pro editor (#2d2a2e). Opacity 0.85 shows the desktop through that color.
background #2d2a2e
foreground #fcfcfa
background_opacity 0.85
dynamic_background_opacity yes

# Tab bar: a step brighter than window bg #2d2a2e. Active tab brighter still.
# Alt+9 is a system shortcut, so tabs are Alt+1 .. Alt+8 only.
tab_bar_min_tabs 1
tab_bar_style slant
tab_bar_background #403e41
tab_bar_font_size 12
active_tab_background #5b595c
active_tab_foreground #c1c0c0
active_tab_font_style normal
inactive_tab_background #403e41
inactive_tab_foreground #727072
inactive_tab_font_style normal

# Distinct sequences so Neovim can map Ctrl+Enter and Ctrl+Alt+E (not the same as Enter / Alt+E).
map ctrl+enter send_text all \x1b[13;5u
map ctrl+alt+e send_text all \x1b[101;7u
map ctrl+alt+q send_text all \x1b[113;7u
map ctrl+alt+h send_text all \x1b[104;7u
map ctrl+alt+l send_text all \x1b[108;7u
map ctrl+alt+j send_text all \x1b[106;7u
map ctrl+alt+k send_text all \x1b[107;7u
map ctrl+alt+d send_text all \x1b[100;7u
map ctrl+alt+p send_text all \x1b[112;7u
map ctrl+alt+f send_text all \x1b[102;7u
map shift+alt+f send_text all \x1b[102;4u
# Ctrl+Shift+E is Kitty URL hints by default; send it to Neovim for :Ex.
map ctrl+shift+e send_text all \x1b[101;6u

map alt+1 goto_tab 1
map alt+2 goto_tab 2
map alt+3 goto_tab 3
map alt+4 goto_tab 4
map alt+5 goto_tab 5
map alt+6 goto_tab 6
map alt+7 goto_tab 7
map alt+8 goto_tab 8

